repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [json, yaml, markdown]

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry:
          bash -c 'export GOPATH="$(pwd)/.go" GOMODCACHE="$(pwd)/.go/pkg/mod"
          GOCACHE="$(pwd)/.go/cache" && nix develop --command golangci-lint run
          --fix ./...'
        language: system
        pass_filenames: false
        files: \.go$

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 42.84.0
    hooks:
      - id: renovate-config-validator

  - repo: local
    hooks:
      - id: go-test-coverage
        name: go-test-coverage
        entry:
          bash -c 'export GOPATH="$(pwd)/.go" GOMODCACHE="$(pwd)/.go/pkg/mod"
          GOCACHE="$(pwd)/.go/cache" && nix develop --command bash -c "go test
          -coverprofile=coverage.out ./... && go-test-coverage --config
          .testcoverage.yaml"'
        language: system
        pass_filenames: false
        files: \.go$
