name: Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Every run pushes the same edge tag, so the last one to finish wins. Runs go
# one at a time, with only the newest waiting, and each builds main as it is
# when it starts, so the last run always builds the newest commit.
concurrency:
  group: edge
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the newest main, not the commit that queued this run.
          ref: main
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push edge image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/claytono/readest-hardcover-sync:edge" \
            --label "org.opencontainers.image.title=readest-hardcover-sync" \
            --label "org.opencontainers.image.description=Syncs reading progress from Readest to Hardcover.app" \
            --label "org.opencontainers.image.version=edge" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --push \
            .
